# Push a tag like v0.1.0 to build installers and attach them to one draft GitHub Release.
# Run manually (Actions -> Release -> Run workflow) to build installers without releasing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error

  # One job creates the release so parallel builds can't create duplicate drafts.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Release notes = commit subjects since the previous version tag. The app
      # shows these in its "What's new" list, so write commit subjects for users.
      - name: Write release notes
        run: |
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range="${previous:+$previous..}${GITHUB_REF_NAME}"
          {
            echo "## What's new"
            echo
            git log "$range" --no-merges --invert-grep --grep='^Version [0-9]' --pretty='- %s'
            echo
            echo "---"
            echo
            echo "Download the installer for your computer below. See the README for first-launch steps."
          } > release-notes.md
          cat release-notes.md
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - run: ls -l installers
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: release-notes.md
          files: installers/*
